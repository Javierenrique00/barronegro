name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir el sitio (Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar JDK 21 (Zulu, igual que gradle-daemon-jvm.properties)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Configurar Gradle con caché
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs
            yarn

      - name: Apuntar al SDK de Android del runner
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Construir el sitio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew :webApp:prepararSitioPages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir el artefacto del sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: webApp/build/pages
          include-hidden-files: true

  desplegar:
    name: Desplegar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar el artefacto
        id: deployment
        uses: actions/deploy-pages@v5
